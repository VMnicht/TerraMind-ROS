# 固件配置记录，当前 launch 不加载；配置值尚未通过本轮实机标定。
# 实机驱动直接下发 m/s、rad/s，不依赖这里的轮径和轮距。
robot:
  geometry_calibrated: false
  wheel_diameter_m: 0.10
  wheel_separation_m: 0.32
  rpm_feedback_axis: gearbox_output
  motor_gear_ratio: 19.2032
  firmware_right_reversed: true
  firmware_angular_reversed: true
  # 输出轴到车轮的外部传动仍待现场核对，禁止用未知值生成里程计。
  motor_to_wheel_ratio: 0.0
